# PlanSys2 parametreleri (MRM)
lifecycle_manager:
  ros__parameters:
    startup_timeout: 10
planner:
  ros__parameters:
    plan_solver_timeout: 20.0
    # POPF: zamansal (durative) PDDL'i destekleyen, kısmi sıralı ileri arama planlayıcısı
    plan_solver_plugins: ["POPF"]
    POPF:
      plugin: "plansys2/POPFPlanSolver"
executor:
  ros__parameters:
    # Bir action'ın 'at start' koşulları bu süre içinde sağlanmazsa action BAŞARISIZ
    # sayılır (varsayılan: sonsuza kadar bekle). Batarya kesintisinin plan
    # başarısızlığına dönüşüp yeniden planlamayı tetiklemesi bu ayara dayanır.
    at_start_requirements_timeout: 3.0
